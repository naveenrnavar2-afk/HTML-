<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MemeForge – Make Memes Instantly</title>
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#1b1b1b;--accent:#ff3d71;--accent2:#ffd400;--line:#1b1b1b}
@media (prefers-color-scheme:dark){:root{--bg:#14121f;--card:#221f33;--ink:#f4f1ff;--line:#f4f1ff}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:20px}
h1{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(2rem,6vw,3.5rem);text-align:center;margin:0;letter-spacing:2px;text-transform:uppercase}
h1 span{color:var(--accent)}
.sub{text-align:center;margin:6px 0 22px;opacity:.75}
.wrap{max-width:980px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:16px;box-shadow:6px 6px 0 var(--line)}
canvas{width:100%;height:auto;border:3px solid var(--line);border-radius:8px;display:block;background:#fff}
label{font-weight:700;font-size:.85rem;text-transform:uppercase;display:block;margin:12px 0 4px}
input[type=text]{width:100%;padding:10px;border:3px solid var(--line);border-radius:8px;font-size:1rem;background:var(--bg);color:var(--ink)}
.tpls{display:flex;flex-wrap:wrap;gap:8px}
.tpl{font-size:1.6rem;padding:6px 12px;border:3px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;transition:transform .1s}
.tpl:hover{transform:translateY(-2px) rotate(-3deg)}
.tpl.on{background:var(--accent2);color:#1b1b1b}
.btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
button.act{flex:1;padding:12px;font-weight:800;font-size:1rem;border:3px solid var(--line);border-radius:10px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:3px 3px 0 var(--line)}
button.act.alt{background:var(--accent2);color:#1b1b1b}
button.act:active{transform:translate(3px,3px);box-shadow:none}
.row{display:flex;gap:12px;align-items:center;margin-top:12px}
input[type=range]{flex:1}
footer{text-align:center;margin-top:24px;font-size:.85rem;opacity:.6}
</style>
</head>
<body>
<h1>Meme<span>Forge</span></h1>
<p class="sub">Pick a template, type your pain, download your masterpiece.</p>

<div class="wrap">
  <div class="card"><canvas id="c" width="600" height="600"></canvas></div>

  <div class="card">
    <label>Template</label>
    <div class="tpls" id="tpls"></div>

    <label for="top">Top text</label>
    <input type="text" id="top" value="ME: I'LL SLEEP EARLY TONIGHT">
    <label for="bot">Bottom text</label>
    <input type="text" id="bot" value="ME AT 3AM: WATCHING MEME COMPILATIONS">

    <div class="row"><b>Size</b><input type="range" id="size" min="24" max="80" value="48"></div>

    <div class="btns">
      <button class="act alt" id="rand">🎲 Random Meme</button>
      <button class="act" id="dl">⬇ Download PNG</button>
    </div>
  </div>
</div>
<footer>Made with 100% organic HTML, zero dependencies.</footer>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=600,H=600;
const T=[
 {e:'🐶',n:'Fine',bg:['#ff9a3c','#c0392b'],big:'🔥🐶☕🔥',panels:false},
 {e:'😎',n:'Drake',bg:['#ff6b81','#2ed573'],panels:true,icons:['🙅','👉😎']},
 {e:'🤡',n:'Clown',bg:['#a29bfe','#6c5ce7'],big:'🤡',panels:false},
 {e:'😱',n:'Shock',bg:['#74b9ff','#0984e3'],big:'😱',panels:false},
 {e:'🐕',n:'Doge',bg:['#ffeaa7','#fdcb6e'],big:'🐕',panels:false},
 {e:'🧠',n:'Brain',bg:['#55efc4','#00b894'],big:'🧠✨',panels:false}
];
const RAND=[
 ["WHEN THE CODE WORKS","AND YOU DON'T KNOW WHY"],
 ["ME: I'LL START MONDAY","ALSO ME: IT'S MONDAY"],
 ["MY WALLET AFTER","ONE 'SMALL' ONLINE ORDER"],
 ["NOBODY:","ABSOLUTELY NOBODY: ME AT 2AM"],
 ["IT WORKED ON MY MACHINE","THEN SHIP YOUR MACHINE"],
 ["TRIED TO FIX ONE BUG","NOW THERE ARE 47 BUGS"],
 ["ONE MORE EPISODE","SUNRISE: HELLO"],
 ["'QUICK 5-MIN MEETING'","*2 HOURS LATER*"]
];
let cur=0;
const tp=document.getElementById('tpls');
T.forEach((t,i)=>{const b=document.createElement('button');b.className='tpl'+(i?'':' on');b.textContent=t.e;b.title=t.n;
 b.onclick=()=>{cur=i;[...tp.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');draw()};tp.appendChild(b)});

function wrap(text,maxW){const w=text.split(' '),l=[];let line='';
 for(const x of w){const t=line?line+' '+x:x;if(ctx.measureText(t).width>maxW&&line){l.push(line);line=x}else line=t}
 if(line)l.push(line);return l}

function memeText(text,cx,y,maxW,size,fromBottom){
 ctx.font=`${size}px Impact,"Arial Black",sans-serif`;ctx.textAlign='center';ctx.textBaseline='top';
 ctx.lineJoin='round';ctx.lineWidth=size/6;ctx.strokeStyle='#000';ctx.fillStyle='#fff';
 const lines=wrap(text.toUpperCase(),maxW),lh=size*1.05;
 let start=fromBottom?y-lines.length*lh:y;
 lines.forEach((ln,i)=>{ctx.strokeText(ln,cx,start+i*lh);ctx.fillText(ln,cx,start+i*lh)});
}

function draw(){
 const t=T[cur],top=document.getElementById('top').value,bot=document.getElementById('bot').value,
  size=+document.getElementById('size').value;
 ctx.clearRect(0,0,W,H);
 if(t.panels){
  [0,1].forEach(i=>{
   const g=ctx.createLinearGradient(0,i*300,W,i*300+300);g.addColorStop(0,t.bg[i]);g.addColorStop(1,'#fff');
   ctx.fillStyle=g;ctx.fillRect(0,i*300,W,300);
   ctx.font='130px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#000';
   ctx.fillText(t.icons[i],150,i*300+150);
   ctx.font='130px serif';
  });
  ctx.fillStyle='#000';ctx.fillRect(0,298,W,4);ctx.fillRect(298,0,4,0);
  // panel text (dark, readable, on right)
  ctx.fillStyle='#111';ctx.textAlign='center';ctx.textBaseline='middle';
  [top,bot].forEach((s,i)=>{
   const sz=size*.7;ctx.font=`bold ${sz}px "Arial Black",Impact,sans-serif`;
   const lines=wrap(s.toUpperCase(),270),lh=sz*1.1,y0=i*300+150-(lines.length-1)*lh/2;
   lines.forEach((ln,k)=>ctx.fillText(ln,450,y0+k*lh));
  });
 }else{
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,t.bg[0]);g.addColorStop(1,t.bg[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=(t.big.length>4?'110px':'250px')+' serif';
  ctx.fillText(t.big,W/2,H/2);
  memeText(top,W/2,16,W-40,size,false);
  memeText(bot,W/2,H-16,W-40,size,true);
 }
 ctx.strokeStyle='#000';ctx.lineWidth=6;ctx.strokeRect(0,0,W,H);
}

['top','bot','size'].forEach(id=>document.getElementById(id).addEventListener('input',draw));
document.getElementById('rand').onclick=()=>{
 const r=RAND[Math.floor(Math.random()*RAND.length)];
 document.getElementById('top').value=r[0];document.getElementById('bot').value=r[1];
 cur=Math.floor(Math.random()*T.length);
 [...tp.children].forEach((x,i)=>x.classList.toggle('on',i===cur));draw();
};
document.getElementById('dl').onclick=()=>{
 const a=document.createElement('a');a.download='my-meme.png';a.href=cv.toDataURL('image/png');a.click();
};
draw();
</script>
</body>
</html>
